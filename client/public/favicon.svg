<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="headlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Tires -->
  <rect x="7" y="38" width="6" height="12" rx="3" fill="#0f172a" />
  <rect x="51" y="38" width="6" height="12" rx="3" fill="#0f172a" />

  <!-- Side Mirrors -->
  <rect x="6.5" y="26.5" width="6" height="3" rx="1.5" fill="#f8fafc" />
  <rect x="51.5" y="26.5" width="6" height="3" rx="1.5" fill="#f8fafc" />

  <!-- Roof & Cabin Pillars -->
  <path d="M19 28 L23 15 C23.8 13 25.8 11.5 28 11.5 L36 11.5 C38.2 11.5 40.2 13 41 15 L45 28 Z" fill="url(#carBody)" />

  <!-- Windshield -->
  <path d="M21.5 26.5 L24.8 16 C25.3 14.8 26.5 14 28 14 L36 14 C37.5 14 38.7 14.8 39.2 16 L42.5 26.5 Z" fill="url(#glass)" />

  <!-- Chassis Body -->
  <rect x="9.5" y="27" width="45" height="20" rx="5" fill="url(#carBody)" />

  <!-- Headlights -->
  <path d="M13 31.5 Q18 32 20 34.5 L18 37.5 Q14 36.5 13 34 Z" fill="url(#headlight)" />
  <path d="M51 31.5 Q46 32 44 34.5 L46 37.5 Q50 36.5 51 34 Z" fill="url(#headlight)" />

  <!-- Center Grille & Accent -->
  <rect x="25" y="36" width="14" height="4.5" rx="2.25" fill="#1e1b4b" />
  <rect x="20" y="42.5" width="24" height="2.5" rx="1.25" fill="#4338ca" />
</svg>
